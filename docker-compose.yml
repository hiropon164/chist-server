# chist aggregation server
#
#   cp .env.example .env && vi .env
#   docker compose up -d --build
#
# Published through an existing Traefik. No host port is opened.
#
# Three routers, because each path needs a different kind of authentication:
#   chist-health  /health only          none (for monitoring)
#   chist-agent   /ingest /mcp /stats   forwardAuth -> /auth checks the bearer token
#   chist-web     everything else       basicauth (for browsers)
# All three are restricted by source IP with ipallowlist.
services:
  chist:
    build: .
    image: chist:latest
    container_name: chist-server
    restart: unless-stopped
    environment:
      CHIST_TOKEN: ${CHIST_TOKEN:?set CHIST_TOKEN in .env}
      CHIST_DB: /data/history.db
      TZ: ${TZ:-UTC}
    volumes:
      - chist-data:/data
    networks:
      - traefik
    # No ports: Traefik reaches 8848 directly from within the same network.
    labels:
      - traefik.enable=true
      - traefik.docker.network=${CHIST_NETWORK:-traefik}

      # --- shared service definition ---
      - traefik.http.services.chist.loadbalancer.server.port=8848
      # Traefik's own health check (separate from the container HEALTHCHECK).
      # It bypasses middleware, so authentication never blocks it.
      - traefik.http.services.chist.loadbalancer.healthcheck.path=/health
      - traefik.http.services.chist.loadbalancer.healthcheck.interval=30s

      # --- 1. /health (unauthenticated) ---
      - traefik.http.routers.chist-health.rule=Host(`${CHIST_HOST:?set CHIST_HOST in .env}`) && Path(`/health`)
      - traefik.http.routers.chist-health.entrypoints=${CHIST_ENTRYPOINT:-websecure}
      - traefik.http.routers.chist-health.tls.certresolver=${CHIST_CERTRESOLVER:?set CHIST_CERTRESOLVER in .env}
      - traefik.http.routers.chist-health.service=chist
      - traefik.http.routers.chist-health.middlewares=chist-allow
      - traefik.http.routers.chist-health.priority=300

      # --- 2. agents (bearer token) ---
      - traefik.http.routers.chist-agent.rule=Host(`${CHIST_HOST}`) && (PathPrefix(`/ingest`) || PathPrefix(`/mcp`) || PathPrefix(`/stats`))
      - traefik.http.routers.chist-agent.entrypoints=${CHIST_ENTRYPOINT:-websecure}
      - traefik.http.routers.chist-agent.tls.certresolver=${CHIST_CERTRESOLVER}
      - traefik.http.routers.chist-agent.service=chist
      - traefik.http.routers.chist-agent.middlewares=chist-allow,chist-auth
      - traefik.http.routers.chist-agent.priority=200

      # --- 3. web UI and API (basicauth) ---
      - traefik.http.routers.chist-web.rule=Host(`${CHIST_HOST}`)
      - traefik.http.routers.chist-web.entrypoints=${CHIST_ENTRYPOINT:-websecure}
      - traefik.http.routers.chist-web.tls.certresolver=${CHIST_CERTRESOLVER}
      - traefik.http.routers.chist-web.service=chist
      - traefik.http.routers.chist-web.middlewares=chist-allow,chist-basicauth
      - traefik.http.routers.chist-web.priority=100

      # --- middleware ---
      # Allowed source ranges, matched against the IP arriving at the router.
      - traefik.http.middlewares.chist-allow.ipallowlist.sourcerange=${CHIST_ALLOW:-127.0.0.1/32}

      # /mcp is routed by the MCP SDK and never reaches the app's _authorized, so
      # forwardAuth sends it to /auth to have the bearer token verified.
      - traefik.http.middlewares.chist-auth.forwardauth.address=http://chist-server:8848/auth

      # Browsers cannot send a bearer token, so basicauth guards them.
      # Generate the hash with htpasswd -nbB and put it in .env (no escaping needed there).
      - traefik.http.middlewares.chist-basicauth.basicauth.users=${CHIST_BASICAUTH:?set CHIST_BASICAUTH in .env}

      # Traefik does not buffer responses by default, so MCP's streamable HTTP passes
      # straight through. Do not attach a buffering middleware — it will hang.

networks:
  traefik:
    external: true
    name: ${CHIST_NETWORK:-traefik}

volumes:
  chist-data:
